<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go with Go</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2b1d12; color: #f6ebd8; font-family: sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; }
    p { margin: 12px; opacity: 0.7; }
    footer { position: fixed; bottom: 8px; width: 100%; text-align: center; font-size: 12px; opacity: 0.45; }
  </style>
</head>
<body>
  <p>Loading Go with Go…</p>
  <footer>© 2026 Bradley Erickson</footer>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then(result => {
      document.querySelector("p").remove();
      go.run(result.instance);
    }).catch(err => {
      document.querySelector("p").textContent = "Failed to load game.wasm. Serve this folder over HTTP (go run ./cmd/serve).";
      console.error(err);
    });
  </script>
</body>
</html>
